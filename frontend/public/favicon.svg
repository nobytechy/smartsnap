<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>

  <!-- CCTV camera silhouette -->
  <g fill="#9C1C2A">
    <!-- Mount arm at top -->
    <rect x="30" y="6" width="4" height="9" rx="1"/>
    <rect x="22" y="3"  width="20" height="4" rx="2"/>
    <!-- Camera body -->
    <path d="M9 22 h36 l5 5 v13 a4 4 0 0 1 -4 4 h-33 a4 4 0 0 1 -4 -4 v-14 a4 4 0 0 1 0 -4 z"/>
  </g>

  <!-- Lens (gold iris, dark pupil) -->
  <circle cx="20" cy="34" r="8" fill="#1E293B"/>
  <circle cx="20" cy="34" r="5" fill="#D89A00"/>
  <circle cx="20" cy="34" r="2" fill="#0F172A"/>
  <!-- Lens highlight -->
  <circle cx="18" cy="32" r="1.2" fill="#FFFCEC" opacity="0.85"/>

  <!-- Recording light -->
  <circle cx="44" cy="28" r="2.5" fill="#22c55e"/>
  <circle cx="44" cy="28" r="4" fill="#22c55e" opacity="0.25"/>
</svg>
